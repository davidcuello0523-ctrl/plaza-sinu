# SPA: cualquier ruta (/catalogo, /pedidos/123…) devuelve index.html y React Router decide.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
