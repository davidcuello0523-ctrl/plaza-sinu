<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plaza Sinú: el mercado de los negocios de Córdoba, en línea." />
    <meta name="theme-color" content="#16324F" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Plaza Sinú</title>
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("plaza.tema"); } catch (e) {}
        if (t !== "oscuro" && t !== "claro") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
